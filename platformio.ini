; PlatformIO project for the ball-balancing robot (VS Code).
; Sketches stay in their Arduino IDE folders; src_dir picks which one to build.
; To build another sketch (e.g. Ball_Balance_LQR), change src_dir below.

[platformio]
; src_dir = compare_test/Ball_Balance_Compare
src_dir = Ball_Balance_KF_LQR

; src_dir = Ball_Bounce
; src_dir = Ball_Balance_LQR


[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
; same libraries as the Arduino IDE (Pixy2, PololuMaestro, ...)
lib_extra_dirs = ~/Documents/Arduino/libraries

monitor_filters = send_on_enter
monitor_eol = LF
monitor_echo = yes
